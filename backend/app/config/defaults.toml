# Default global settings (FR-8.1, spec §8). The chat and embedding models are suggested starting
# points that the setup checklist verifies and users can change in Settings; the speech models stay
# empty because they are downloaded only on request.
chat_model = "llama3.1"
embedding_model = "nomic-embed-text"
stt_model = ""
tts_model = ""
tts_voice_a = ""
tts_voice_b = ""
llm_base_url = "http://127.0.0.1:11434/v1"
llm_api_key = ""
setup_completed = false
max_sources_per_notebook = 50
max_upload_mb = 200
retrieval_top_k = 8
context_window_tokens = 8000
# Network (FR-8.6): each can be switched off. Nothing here is on by default except actions the
# user starts themselves; Discover also needs a search provider URL.
allow_web_import = true
allow_discover = true
allow_model_downloads = true
transcribe_uncaptioned_videos = false
searxng_url = ""
# Appearance (spec 5.2): follow the operating system unless the user picks a theme; base font in px.
theme = "system"
font_size = 16
