name: Release

# Push a tag such as v1.0.0 (or create a release in the GitHub web page) to build a download that
# already contains the built web page, so end users do not need Node.js. If the release already
# exists the zip is attached to it; otherwise the release is created.
on:
  push:
    tags: ["v*"]
  # Run by hand (Actions tab, then Release, then Run workflow) to build and attach the zip for an
  # existing tag, for example one whose first run failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the zip to (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web page
        run: npm ci && npm run build
        working-directory: frontend
      - name: Package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name="LocalNotebook-${TAG}"
          mkdir -p "dist-release/$name"
          git archive HEAD | tar -x -C "dist-release/$name"
          cp -r frontend/dist "dist-release/$name/frontend/dist"
          (cd dist-release && zip -qr "../$name.zip" "$name")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          GITHUB_REF_NAME="$TAG"
          zip="LocalNotebook-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The release was created in the web page (which also created this tag): add the zip.
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            flags=""
            case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag $flags \
              --title "LocalNotebook ${GITHUB_REF_NAME}" --generate-notes
          fi
