[project]
name = "localnotebook"
version = "0.0.1"
description = "Local, source-grounded research notebook."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlite-vec>=0.1.9",
    "numpy>=2.4.6",
    "reportlab>=5.0.1",
    "markdown-it-py>=4.2.0",
    "trafilatura>=2.3.1",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
    "faster-whisper>=1.2.1",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "llm: requires a real model (skipped by default)",
    "e2e: drives the built UI in a real browser (QA-5); run with `uv run pytest -m e2e`",
]
addopts = "-m 'not llm and not e2e'"

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
